name: Windows release bundles

on:
  workflow_dispatch:
  push:
    branches: [windows-desktop, main]

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install AgentBase dependencies
        run: npm ci
      - name: Install desktop dependencies
        run: npm ci --prefix desktop
      - name: Check shared desktop behavior
        run: |
          npm run build
          node --test test/desktop-skill.test.mjs test/desktop-view-model.test.mjs test/desktop-connection-actions.test.mjs test/desktop-memory-actions.test.mjs test/desktop-analysis-view.test.mjs
      - name: Build Windows bundles
        run: npm run build:windows --prefix desktop
      - name: Capture Windows Store screenshot
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $env:AGENTBASE_HOME = Join-Path $env:RUNNER_TEMP 'agentbase-screenshot-store'
          $env:AGENTBASE_SCREENSHOT_PATH = Join-Path $env:RUNNER_TEMP 'agentbase-windows-store.png'
          node scripts/seed-store-screenshot.mjs $env:AGENTBASE_HOME
          & .\desktop\node_modules\.bin\electron.cmd .\desktop\capture-store.mjs
          if (-not (Test-Path $env:AGENTBASE_SCREENSHOT_PATH)) { throw 'Screenshot was not created.' }
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: agentbase-windows-store-screenshot
          path: ${{ runner.temp }}/agentbase-windows-store.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: agentbase-windows-bundles
          path: |
            build/windows/*.appx
            build/windows/*.zip
          if-no-files-found: error
